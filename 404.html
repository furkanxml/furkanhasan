<!doctype html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Sayfa bulunamadı — Furkan Hasan Osmanoğlu</title>
        <meta name="theme-color" content="#070b1f" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap"
        />
        <!-- Stil sayfanın içinde: GitHub Pages bu sayfayı her adreste gösterebildiği
             için harici CSS yolu bazı adreslerde bulunamazdı. -->
        <style>
            *, *::before, *::after { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100svh;
                display: grid;
                align-items: center;
                background: #070b1f;
                color: #f1f3f8;
                font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .wrap {
                width: 100%;
                max-width: 1520px;
                margin-inline: auto;
                padding: 4rem clamp(16px, 4vw, 56px);
                display: grid;
                gap: 1.75rem;
                justify-items: start;
            }
            .eyebrow {
                margin: 0;
                font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
                font-size: .78rem;
                letter-spacing: .08em;
                text-transform: uppercase;
                color: rgba(241, 243, 248, .64);
            }
            .eyebrow span { color: #8fb3ff; }
            h1 {
                margin: 0;
                font-size: clamp(2.75rem, 7.5vw, 7.5rem);
                font-weight: 800;
                font-stretch: 62%;
                line-height: .88;
                letter-spacing: -.01em;
            }
            h1 em { font-style: normal; color: #3b7bff; }
            p.lead { margin: 0; max-width: 40ch; font-size: 1.125rem; color: rgba(241, 243, 248, .64); }
            .buttons { display: flex; flex-wrap: wrap; gap: .75rem; }
            .pill {
                display: inline-flex;
                align-items: center;
                padding: .85rem 1.35rem;
                border-radius: 999px;
                border: 1px solid rgba(241, 243, 248, .16);
                color: inherit;
                font-weight: 600;
                font-size: .9375rem;
                text-decoration: none;
                transition: background-color .3s, color .3s, border-color .3s;
            }
            .pill:hover { background: #f1f3f8; color: #070b1f; border-color: #f1f3f8; }
            .pill--accent { background: #3b7bff; border-color: #3b7bff; color: #fff; }
            .pill--accent:hover { background: #f1f3f8; border-color: #f1f3f8; color: #070b1f; }
            :focus-visible { outline: 2px solid #8fb3ff; outline-offset: 3px; }
        </style>
    </head>
    <body>
        <main class="wrap">
            <p class="eyebrow"><span>✦</span> 404 · Sayfa bulunamadı</p>
            <h1>Aradığınız sayfa burada değil<em>.</em></h1>
            <p class="lead">Bağlantı değişmiş ya da sayfa kaldırılmış olabilir.</p>
            <div class="buttons">
                <a class="pill pill--accent" href="https://furkanhasan.com/">Ana sayfaya dön</a>
                <a class="pill" href="https://furkanhasan.com/#projeler">Projeler</a>
            </div>
        </main>
    </body>
</html>
